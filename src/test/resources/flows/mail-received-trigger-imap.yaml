id: mail-received-trigger-imap
namespace: io.kestra.tests
tasks:
  - id: process-imap-emails
    type: io.kestra.plugin.core.debug.Return
    format: "IMAP emails received: {{trigger.total}} emails, latest: {{trigger.latestEmail.subject}}"
triggers:
  - id: imap-mail-trigger
    type: io.kestra.plugin.email.MailReceivedTrigger
    protocol: IMAP
    host: "127.0.0.1"
    port: 3144
    username: "test@localhost"
    password: "password"
    ssl: false
    trustAllCertificates: true
    interval: PT1S
