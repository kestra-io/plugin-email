id: real-time-trigger-imap-attachment
namespace: io.kestra.tests

tasks:
  - id: process-imap-emails
    type: io.kestra.plugin.core.debug.Return
    format: "IMAP email received: {{trigger.subject}} from {{trigger.from}}"

triggers:
  - id: imap-real-time-trigger-attachment
    type: io.kestra.plugin.email.RealTimeTrigger
    protocol: IMAP
    host: "127.0.0.1"
    port: 3144
    username: "test@localhost"
    password: "password"
    ssl: false
    trustAllCertificates: true
    interval: PT1S
